name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install
        run: pip install -r requirements_test.txt

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: JavaScript syntax
        run: node --check custom_components/daytime_sc25/frontend/daytime-sc25-card.js

      # SC25_HOST stays unset, so tests/test_live.py skips itself: those tests
      # talk to real hardware. Everything else runs against tests/fake_sc25.py.
      - name: Pytest
        run: pytest -q
